# MagnaCMS — local-dev orchestration.
# `docker compose up` brings up Postgres + the backend. The frontend runs
# outside compose: `pnpm dev` in `frontend/` (see the README's Quick start).
# Both ports are published on 127.0.0.1 only: the database uses the default
# app/app password and the `local` environment accepts placeholder secrets,
# so neither service should be reachable from other machines on the network.

services:
  postgres:
    image: postgres:16-alpine
    container_name: magnacms-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-app}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: magnacms-backend
    env_file: .env
    environment:
      # Inside the compose network, the backend talks to Postgres by
      # service name; this override wins against any .env value that
      # assumed a host-side reach.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@postgres:5432/${POSTGRES_DB:-app}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; r=urllib.request.urlopen('http://localhost:8000/api/v1/health',timeout=3); sys.exit(0 if r.status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

volumes:
  postgres_data:
