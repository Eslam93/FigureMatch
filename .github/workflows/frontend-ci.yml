name: frontend-ci

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (Next.js + ESLint)
        run: pnpm lint

      - name: Prettier check
        run: pnpm format:check

      - name: TypeScript check
        run: pnpm typecheck

      - name: Unit tests (Vitest)
        run: pnpm test

      - name: Next.js build (static export)
        # Deploys ship the static export (README §10), so CI builds that.
        env:
          NEXT_OUTPUT: export
        run: pnpm build

      - name: Check the static export
        run: |
          for page in out/index.html out/404.html; do
            test -f "$page" || { echo "::error::$page is missing from the static export"; exit 1; }
          done
