# Fails when a file lacks a copyright or licence line, so a new file can't
# land without saying who wrote it and under what terms. Files that take no
# header are covered by REUSE.toml.
name: reuse

on:
  push:
    # `claude/**` so a working branch is checked on every push without
    # needing an open pull request.
    branches: [main, 'claude/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: reuse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: latest

      - name: reuse lint
        # The charset-normalizer extra detects file encodings without
        # needing libmagic, so the same command works on any runner.
        run: uvx --from "reuse[charset-normalizer]==6.3.0" reuse lint
