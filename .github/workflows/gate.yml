# Checks the parity gate's matcher (see gate/README.md): lint, types, the
# fresh test cases, and that gate/SCORE.md is what the matcher produces on
# the labelled cases, so a change to the matcher cannot leave a stale score.
name: gate

on:
  push:
    branches: [main, 'claude/**']
    paths:
      - 'gate/**'
      - '.github/workflows/gate.yml'
  pull_request:
    paths:
      - 'gate/**'
      - '.github/workflows/gate.yml'

permissions:
  contents: read

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matcher:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./gate
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: latest
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Lint, typecheck, test, check the score
        run: |
          uv sync --frozen
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy matcher score.py tests
          uv run pytest
          uv run python score.py --check
